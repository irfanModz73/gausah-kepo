<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>irfan?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #fde68a;
      background-image:
        radial-gradient(#000 1.5px, transparent 1.5px),
        radial-gradient(#000 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }
    .neo-shadow {
      box-shadow: 8px 8px 0 0 #000;
    }
    .neo-shadow-sm {
      box-shadow: 4px 4px 0 0 #000;
    }
    .neo-btn {
      transition: all 0.1s ease;
    }
    .neo-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 0 #000;
    }
    .neo-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 0 #000;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <main class="max-w-2xl w-full">
    
    <div class="bg-white border-4 border-black neo-shadow p-8 md:p-12 text-center">

      
      <div class="inline-block bg-lime-400 border-4 border-black px-4 py-1 font-bold text-sm uppercase tracking-wider mb-6 neo-shadow-sm rotate-[-2deg]">
        🔥 Promo Terbatas
      </div>

      
      <h1 class="text-3xl md:text-5xl font-bold leading-tight mb-6 text-black">
        Claim free akun
        <span class="bg-cyan-300 px-2 inline-block border-4 border-black rotate-[1deg] my-1">ChatGPT Pro</span>
        <span class="bg-pink-300 px-2 inline-block border-4 border-black rotate-[-1deg] my-1">GrokHeavy</span>
        <span class="bg-violet-300 px-2 inline-block border-4 border-black rotate-[1deg] my-1">Claude Max</span>
        <span class="bg-orange-300 px-2 inline-block border-4 border-black rotate-[-1deg] my-1">Gemini Plus</span>
      </h1>

      
      <p class="text-lg md:text-xl font-medium mb-10 text-gray-800">
        silakan klik button di bawah 👇
      </p>

      
      <a href="https://youtu.be/dQw4w9WgXcQ?si=qDmwzsEG-qsNM7Yf"
         target="_blank"
         rel="noopener noreferrer"
         class="neo-btn inline-block bg-yellow-400 border-4 border-black px-12 py-4 text-2xl font-bold uppercase tracking-wide neo-shadow cursor-pointer">
        Disini
      </a>

      
      <p class="mt-8 text-sm font-medium text-gray-600">
        *100% free - no hoax*
      </p>
    </div>
  </main>

</body>
</html>
